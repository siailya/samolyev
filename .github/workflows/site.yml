name: Static site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: samolyev-site:test
          build-args: SITE_REVISION=${{ github.sha }}
      - name: Check container HTTP behavior
        run: |
          docker run -d --name site -p 8080:8080 samolyev-site:test
          trap 'docker rm -f site' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then break; fi
            sleep 1
          done
          SITE_REVISION=${{ github.sha }} SITE_CONTAINER_URL=http://localhost:8080 node --test tests/container.test.cjs
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: checks
    outputs:
      published: ${{ steps.head.outputs.current == 'true' && steps.image.outcome == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check current main head before publication
        id: head
        run: node scripts/current-head.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        if: steps.head.outputs.current == 'true'
      - uses: docker/login-action@v3
        if: steps.head.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        if: steps.head.outputs.current == 'true'
        with:
          context: .
          push: true
          build-args: SITE_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/siailya/samolyev-site:latest
            ghcr.io/siailya/samolyev-site:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/siailya/samolyev
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.publish.outputs.published == 'true'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check current main head, request deployment and verify release
        run: node scripts/komodo-deploy.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
          KOMODO_WEBHOOK_URL: ${{ secrets.KOMODO_WEBHOOK_URL }}
