services:
  site:
    image: ghcr.io/siailya/samolyev-site:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy_network
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy_network
      traefik.http.routers.samolyev-site.rule: Host(`samolyev.ru`)
      traefik.http.routers.samolyev-site.entrypoints: websecure
      traefik.http.routers.samolyev-site.tls.certresolver: letsencrypt
      traefik.http.routers.samolyev-site.service: samolyev-site
      traefik.http.services.samolyev-site.loadbalancer.server.port: "8080"
networks:
  proxy_network:
    external: true
    name: proxy_network
