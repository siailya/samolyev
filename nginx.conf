# Redirect only original external requests, never internal index/file resolution.
# Map values are fixed canonical paths; preserve the original query separately.
map $request_uri $canonical_path {
    default "";
    ~^/(en/?|en/index\.html|index\.html)(\?.*)?$ /;
    ~^/ru(?:/|/index\.html)(\?.*)?$ /ru;
    ~^/(?:en/experience(?:/|\.html|/index\.html)?|experience(?:/|\.html|/index\.html))(\?.*)?$ /experience;
    ~^/ru/experience(?:/|\.html|/index\.html)(\?.*)?$ /ru/experience;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    if ($canonical_path != "") {
        return 301 $canonical_path$is_args$args;
    }

    # A map keeps headers inherited by every location, including errors.
    add_header Cache-Control $site_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # ascii.rest loads its piece and font remotely and styles its shadow DOM.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://ascii.rest; connect-src 'self' https://ascii.rest https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://ascii.rest; font-src 'self' https://ascii.rest; img-src 'self' data: https://ascii.rest; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /ru {
        default_type text/html;
        alias /usr/share/nginx/html/ru/index.html;
    }

    location = /experience {
        default_type text/html;
        alias /usr/share/nginx/html/en/experience.html;
    }

    location = /ru/experience {
        default_type text/html;
        alias /usr/share/nginx/html/ru/experience.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

map $uri $site_cache {
    default "no-cache";
    ~*\.(css|js|woff2?)$ "public, max-age=3600";
}
